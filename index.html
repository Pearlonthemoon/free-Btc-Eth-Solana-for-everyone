    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      window.addEventListener(
        'error',
        function (e) {
          var f = (e && e.filename) || '';
          var m = (e && e.message) || '';
          if (
            f.indexOf('chrome-extension://') === 0 ||
            (m.indexOf('SecurityError') !== -1 && m.indexOf('cross-origin frame') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (e) {
          var r = e && e.reason;
          var msg = (r && r.message) || String(r || '');
          var stack = (r && r.stack) || '';
          if (
            stack.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            (msg.indexOf('SecurityError') !== -1 && msg.indexOf('cross-origin frame') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
